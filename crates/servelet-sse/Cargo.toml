[package]
name = "servelet-sse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Server-Sent Events: the event encoder and the line-buffered parser, against servelet-core's types."

[dependencies]
servelet-core = { path = "../servelet-core" }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
