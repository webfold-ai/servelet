[workspace]
resolver = "2"
members = [
    "crates/servelet-client",
    "crates/servelet-cookie",
    "crates/servelet-core",
    "crates/servelet-router",
    "crates/servelet-h1",
    "crates/servelet-sse",
    "crates/servelet-tls",
    "crates/servelet-uri",
    "crates/servelet-ws",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# One hashtrinity for every crate, and the SAME one every other Ptyktos crate in the platform
# uses: this GitHub URL at this rev (transport, relayfold, kleis, hosting-runtime pin exactly
# this form). Cargo treats a different URL, rev or branch as a different package, so two forms in
# one graph make `hashtrinity::Table` two incompatible types. This was the self-hosted GitLab
# mirror on `branch = "main"`: unreachable from builders and a moving target. A branch is never a
# pin; the rev is.
hashtrinity = { git = "https://github.com/Ptyktos/hashtrinity", rev = "b6aa208afa682ba0951f1b74941d140fbfa9fc50", features = ["codec", "validate", "error", "derive"] }

# Shared, minimal tokio. `default-features = false` everywhere so no crate inherits a feature
# (the `full` blowup, or `rt-multi-thread`) it does not name itself.
tokio = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
# Client TLS, behind servelet-client's off-by-default `tls` feature (rule 6).
rustls-native-certs = { version = "0.8", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false