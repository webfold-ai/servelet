[workspace]
resolver = "2"
members = [
    "crates/servelet-client",
    "crates/servelet-cookie",
    "crates/servelet-core",
    "crates/servelet-router",
    "crates/servelet-h1",
    "crates/servelet-sse",
    "crates/servelet-tls",
    "crates/servelet-uri",
    "crates/servelet-ws",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# One wirefold (and, through it, one apeiron) for every crate: `wirefold::Table` is apeiron's table, so a second
# URL, rev or branch anywhere in a consumer's graph would make it two incompatible types. A branch is never a pin; the rev is.
wirefold = { git = "https://github.com/webfold-ai/wirefold", rev = "ba9a71284844cd1a7f14ae3b7105ad972aaa9e07", default-features = false, features = ["codec", "syntax", "error", "validate", "derive"] }

# Shared, minimal tokio. `default-features = false` everywhere so no crate inherits a feature
# (the `full` blowup, or `rt-multi-thread`) it does not name itself.
tokio = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
# Client TLS, behind servelet-client's off-by-default `tls` feature (rule 6).
rustls-native-certs = { version = "0.8", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false